org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# ★★★ 必须 = false（允许传递 R 类）。这一行是真机启动崩溃的修复。
#
# 症状：点应用图标 → 闪一下就退回桌面，进程直接死。
#   java.lang.NoClassDefFoundError: Failed resolution of: Landroidx/startup/R$string;
#       at androidx.startup.AppInitializer.discoverAndInitialize(AppInitializer.java:217)
#       at androidx.startup.InitializationProvider.onCreate(InitializationProvider.java:49)
#
# 根因（已解包 AAR 实测）：
#   `startup-runtime-1.1.1.aar` 的 classes.jar 里**只有 4 个类**
#   （AppInitializer / InitializationProvider / Initializer / StartupLogger），
#   **根本没有 R.class 或 R$string.class** —— 它依赖宿主工程生成的传递 R 类。
#   而 `nonTransitiveRClass=true` 让本工程只生成自己的 R，
#   于是 `androidx.startup.R$string` 两边都没有 ⇒ 一启动就 NoClassDefFoundError。
#
# 曾经排除掉的错误方向（别再走一遍）：
#   ✗ 不是 R8/shrinkResources —— debug 构建根本没开 minify。
#   ✗ 不是资源被裁 —— aapt2 dump 能看到 string/androidx_startup 在 APK 里。
#   ✗ 不是 provider 缺失 —— merged manifest 里 InitializationProvider 在。
#   ✗ 把它提成 implementation 一等依赖也**没用**（试过，照样崩）。
#
# 代价：本项目只有 app 一个模块带资源，关掉传递 R 的收益（编译速度）本来就很小。
android.nonTransitiveRClass=false
kotlin.code.style=official
android.overridePathCheck=true
