name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # 测试：所有 push / PR 都跑
  # ============================================================
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ★★★ 只装 JDK 25，**不要**再单独装 17。
      #
      #   两个 setup-java 步骤会互相覆盖 `JAVA_HOME`（后装的赢），
      #   而 Gradle 的 toolchain 只认 JAVA_HOME 指向的那个 JDK 是否满足版本要求。
      #
      #   本项目的实际情况：
      #     app         → source/target 17（AGP 要求）
      #     core-*      → toolchain Java 25，jvmTarget 17
      #   ⇒ 一个 JDK 25 同时满足两者：它能编译 `--release 17` 的代码，
      #     也正是 toolchain 声明要的那个版本。
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ★ 显式补一次执行位。
      #
      #   这个仓库的开发机是 Windows —— git 在那边默认 `core.filemode = false`，
      #   所以 `gradlew` 提交上去是 100644。Linux runner 上 `./gradlew` 于是
      #   直接 exit 126（Permission denied），报错信息里看不出是权限问题。
      #
      #   git 索引里已经改成 100755 了，但这一步是兜底：
      #   以后任何人从 Windows 重新生成 wrapper，都不会再让 CI 红一次。
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :core-memory:test :core-tools:test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            core-memory/build/reports/tests/
            core-tools/build/reports/tests/
          retention-days: 7

  # ============================================================
  # Debug 包：main 分支上每次 push 都出一个，方便随时装
  # ============================================================
  debug:
    name: Debug APK
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build debug
        run: ./gradlew :app:assembleDebug

      - name: Rename artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/chatmobile-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: chatmobile-debug
          path: out/*.apk
          retention-days: 30

  # ============================================================
  # Release 包：只有打 tag 时才出，并发布到 GitHub Releases
  # ============================================================
  release:
    name: Release APK
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 需要它才能创建 Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ★★★ 签名密钥从仓库 Secret 还原，**不进版本库**。
      #
      #   需要的 Secrets（在 Settings → Secrets and variables → Actions 里配）：
      #     RELEASE_STORE_BASE64    keystore 文件的 base64
      #     RELEASE_STORE_PASSWORD  仓库口令
      #     RELEASE_KEY_ALIAS       密钥别名
      #     RELEASE_KEY_PASSWORD    密钥口令
      #
      #   ★ 生成 base64：base64 -w0 release.jks > store.b64
      #
      #   缺任何一个 ⇒ 打出来的是未签名包，**Release 步骤会直接失败**（见下面校验）。
      #   这是有意的：宁可构建失败，也不要发出一个装不上的包。
      - name: Restore signing keystore
        run: |
          if [ -z "${{ secrets.RELEASE_STORE_BASE64 }}" ]; then
            echo "::error::缺少 RELEASE_STORE_BASE64，无法签名 release 包"
            exit 1
          fi
          echo "${{ secrets.RELEASE_STORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > local.properties <<EOF
          RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build release
        run: ./gradlew :app:assembleRelease

      # ★ 防呆：确认产物**真的**是签名过的。
      #   "构建成功" ≠ "出的是签名包" —— 未签名的 release 用户装不上，
      #   而这种失败在 CI 日志里看起来完全正常。
      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "产物: $APK"
          if echo "$APK" | grep -q unsigned; then
            echo "::error::产物是未签名包，拒绝发布"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -20

      - name: Rename artifact
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          NAME="chatmobile-${GITHUB_REF_NAME}.apk"
          mkdir -p out
          cp "$APK" "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "out/$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装

            下载 `chatmobile-${{ github.ref_name }}.apk` 直接安装。

            - 包名 `com.chatmobile`，与 debug 版（`com.chatmobile.debug`）**可以共存**
            - 最低 Android 8.0（API 26），仅 arm64-v8a
            - 体积 ${{ steps.apk.outputs.size }}

            ## 首次使用

            添加模型 → 选服务商 → 填你自己的 API Key。没有账号体系，请求直连你填的地址。

            详见 [README](../../blob/main/README.md)。
